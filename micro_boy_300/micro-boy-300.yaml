substitutions:
  name: micro-boy-300
  friendly_name: "Micro-Boy 300"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(va_state) = id(mic_mute).state ? 5 : 0;
      - script.execute: update_status

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret micro_boy_300_api_key
  on_client_connected:
    - if:
        condition:
          binary_sensor.is_off: mic_mute
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:

ota:
  - platform: esphome
    password: !secret micro_boy_300_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Micro-Boy 300 Fallback"

captive_portal:

# 0 = bereit, 1 = hoert zu, 2 = denkt nach, 3 = antwortet, 4 = Fehler, 5 = stumm
globals:
  - id: va_state
    type: int
    restore_value: no
    initial_value: "0"

# ---------- Audio ----------
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_spk_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    bits_per_sample: 32bit
    channel: left
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_spk_bus
    i2s_dout_pin: GPIO16
    dac_type: external
    channel: mono

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    gain_factor: 4
  models:
    - model: https://microwakeword.com/api/models/31/manifest.json
      id: hey_beepoh
    - model: okay_nabu
      id: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  micro_wake_word: mww
  speaker: spk
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - globals.set: { id: va_state, value: "1" }
    - script.execute: update_status
  on_stt_vad_end:
    - globals.set: { id: va_state, value: "2" }
    - script.execute: update_status
  on_tts_start:
    - globals.set: { id: va_state, value: "3" }
    - script.execute: update_status
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - if:
        condition:
          binary_sensor.is_on: mic_mute
        then:
          - globals.set: { id: va_state, value: "5" }
          - script.execute: update_status
        else:
          - if:
              condition:
                lambda: return id(va_state) != 4;
              then:
                - globals.set: { id: va_state, value: "0" }
                - script.execute: update_status
          - micro_wake_word.start:
  on_error:
    - globals.set: { id: va_state, value: "4" }
    - script.execute: update_status
    - delay: 3s
    - lambda: |-
        id(va_state) = id(mic_mute).state ? 5 : 0;
    - script.execute: update_status

# ---------- Schalter + Taste ----------
binary_sensor:
  # Schiebeschalter: Mitte an GPIO10, ein Aussenpin an GND = stumm
  - platform: gpio
    id: mic_mute
    name: "Mikrofon stumm"
    pin:
      number: GPIO10
      mode: input_pullup
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - globals.set: { id: va_state, value: "5" }
      - script.execute: update_status
    on_release:
      - globals.set: { id: va_state, value: "0" }
      - script.execute: update_status
      - micro_wake_word.start:

  # Taster: ein Bein an GPIO11, das andere an GND = Push-to-Talk
  - platform: gpio
    name: "Taste"
    pin:
      number: GPIO11
      mode: input_pullup
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      - if:
          condition:
            binary_sensor.is_off: mic_mute
          then:
            - if:
                condition: voice_assistant.is_running
                then:
                  - voice_assistant.stop:
                else:
                  - voice_assistant.start:

# ---------- OLED-Gesicht ----------
i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 100ms
    lambda: |-
      const uint32_t now = millis();
      const int state = id(va_state);

      // Zustand merken, damit Animationen bei jedem Wechsel neu starten
      static int last_state = -1;
      static uint32_t idle_since = 0;
      static uint32_t next_blink = 0;
      static uint32_t next_look = 0;
      static int look_x = 0, look_y = 0;

      if (state != last_state) {
        last_state = state;
        idle_since = now;
        look_x = 0;
        look_y = 0;
        next_blink = now + 2000 + random_uint32() % 3000;
        next_look = now + 3000;
      }

      // Gefuelltes Rechteck mit runden Ecken
      auto rrect = [&](int x, int y, int w, int h, int r) {
        if (w <= 0 || h <= 0) return;
        r = std::min(r, std::min(w, h) / 2);
        if (r <= 0) { it.filled_rectangle(x, y, w, h); return; }
        it.filled_rectangle(x + r, y, w - 2 * r, h);
        it.filled_rectangle(x, y + r, w, h - 2 * r);
        it.filled_circle(x + r, y + r, r);
        it.filled_circle(x + w - 1 - r, y + r, r);
        it.filled_circle(x + r, y + h - 1 - r, r);
        it.filled_circle(x + w - 1 - r, y + h - 1 - r, r);
      };

      // Ein Auge, zentriert auf (cx, cy)
      auto eye = [&](int cx, int cy, int w, int h) {
        rrect(cx - w / 2, cy - h / 2, w, h, 6);
      };

      const int LX = 40, RX = 88, CY = 16;

      switch (state) {
        case 1: {  // hoert zu: grosse, offene Augen
          eye(LX, CY, 28, 26);
          eye(RX, CY, 28, 26);
          break;
        }
        case 2: {  // denkt nach: Blick nach oben, wandert hin und her
          int dx = ((now / 700) % 2) ? 10 : -10;
          eye(LX + dx, CY - 5, 22, 14);
          eye(RX + dx, CY - 5, 22, 14);
          break;
        }
        case 3: {  // antwortet: froehliche Boegen, leicht wippend
          int b = ((now / 200) % 2) ? 1 : 0;
          for (int cx : {LX, RX}) {
            it.filled_circle(cx, CY + b, 12);
            it.filled_circle(cx, CY + 6 + b, 12, COLOR_OFF);
          }
          break;
        }
        case 4: {  // Fehler: X-Augen
          for (int cx : {LX, RX}) {
            for (int d = -1; d <= 1; d++) {
              it.line(cx - 8 + d, CY - 8, cx + 8 + d, CY + 8);
              it.line(cx + 8 + d, CY - 8, cx - 8 + d, CY + 8);
            }
          }
          break;
        }
        case 5: {  // stumm: geschlossene Augen
          it.filled_rectangle(LX - 12, CY - 1, 24, 3);
          it.filled_rectangle(RX - 12, CY - 1, 24, 3);
          break;
        }
        default: {  // bereit: blinzeln und ab und zu umschauen
          // Nach 10 Minuten ohne Aktivitaet schlafen (Display dunkel, gegen Einbrennen)
          if (now - idle_since > 10UL * 60UL * 1000UL) break;

          if (now >= next_look) {
            int r = random_uint32() % 5;
            look_x = (r == 1) ? -8 : (r == 2) ? 8 : 0;
            look_y = (r == 3) ? -3 : 0;
            next_look = now + 2500 + random_uint32() % 4000;
          }

          int h = 20;
          if (now >= next_blink) {
            if (now < next_blink + 150) h = 2;
            else next_blink = now + 2500 + random_uint32() % 4000;
          }

          eye(LX + look_x, CY + look_y, 24, h);
          eye(RX + look_x, CY + look_y, 24, h);
          break;
        }
      }

# ---------- LED-Pixel ----------
light:
  # Physical strip: 8 LEDs. LED 0 sits under the plug and stays dark
  # (breadboard phase only). Final build: num_leds 7, partition from 0 to 6.
  - platform: esp32_rmt_led_strip
    id: leds_raw
    internal: true
    pin: GPIO21
    num_leds: 8
    chipset: ws2812
    channel_colors: GRB

  - platform: partition
    id: leds
    name: "Status LEDs"
    default_transition_length: 0.3s
    segments:
      - id: leds_raw
        from: 1
        to: 7
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 0.6s
          update_interval: 0.6s
          min_brightness: 20%
          max_brightness: 70%

script:
  - id: update_status
    mode: restart
    then:
      - component.update: oled
      - lambda: |-
          auto call = id(leds).turn_on();
          call.set_brightness(0.5);
          switch (id(va_state)) {
            case 1: call.set_rgb(0.0, 0.3, 1.0); call.set_effect("Pulse"); break;
            case 2: call.set_rgb(0.6, 0.0, 1.0); call.set_effect("None"); break;
            case 3: call.set_rgb(0.0, 1.0, 0.2); call.set_effect("None"); break;
            case 4: call.set_rgb(1.0, 0.0, 0.0); call.set_effect("None"); break;
            case 5: call.set_rgb(1.0, 0.0, 0.0); call.set_brightness(0.15); call.set_effect("None"); break;
            default: id(leds).turn_off().perform(); return;
          }
          call.perform();